[project]
name = "hoteldb-lecture"
version = "0.1.0"
description = "HotelDB: 90-minuetige interaktive Datenbankvorlesung mit Coding Agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "itsdangerous>=2.2,<3",
  "sqlparse>=0.5.3,<1",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "faker>=30,<40", "numpy>=2,<3",
       "psycopg2-binary>=2.9,<3"]  # psycopg2: used by connect_do_db.ipynb
analytics = [
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "pyarrow>=17,<30",
  "matplotlib>=3.9,<4",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "ipykernel>=6.29,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mission02: intentional red tests, activated during lecture",
  "mission03: intentional red tests, activated during lecture",
  "integration: requires a running PostgreSQL database",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js"]
