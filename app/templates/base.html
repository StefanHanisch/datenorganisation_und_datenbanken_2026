<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}GlobalStay{% endblock %} · HotelDB</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/ui.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="nav-content">
      <a href="/" class="brand"><span class="brand-mark">G</span> GLOBAL<span>STAY</span></a>
      {% if role %}
        <nav aria-label="Hauptmenü">
          <a href="/">Hotels</a><a href="/bookings">Meine Buchungen</a><a href="/admin">Control Center</a>
        </nav>
        <div class="nav-end"><span class="role-pill">{{ 'Lehrperson' if is_teacher else 'IT-Team' }}</span>
          <form action="/logout" method="post"><button class="link-button">Abmelden</button></form></div>
      {% endif %}
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>HOTELDB · Interaktive Datenbankvorlesung · Ausschließlich synthetische Gästedaten</footer>
</body>
</html>
